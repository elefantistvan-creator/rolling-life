<style>
  *{box-sizing:border-box;margin:0;padding:0}

<body>
<div id="pick" class="wrap">
  <h1>Test tracks</h1>
  <button id="bScreen">This is the SCREEN</button>

</div>

</div>
<div id="screen" class="hidden"><canvas id="cv"></canvas><div id="hud"></div><div id="big"></div><button id="back" class="alt hidden">◀ Tracks (M)</button><div id="knobs" class="hidden"></div><div id="menu" class="hidden"></div></div>

    <div class="big2">TRAY</div>
    <div class="muted" id="cInfo">Hold the phone flat in ONE hand, screen up, like a tray.<br>Phone level with the floor = tray level.<br>Look at the big screen, not here.</div>
  </div>
  <button id="bZero" class="alt">Re-level (optional)</button>

<script>
// ---------- relay: same public MQTT brokers as the Gorillas game ----------
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const ROOT='tray-tests/v1/';
let role='', code='', clients=[], onMsg=()=>{};
const $=id=>document.getElementById(id);
const show=id=>{ for(const s of ['pick','wait','screen','join','ctrl']) $(s).classList.toggle('hidden',s!==id); };
function loadScript(src,cb,err){ const s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=err; document.head.appendChild(s); }
function inbox(){ return ROOT+code+(role==='screen'?'/s':'/c'); }
function outbox(){ return ROOT+code+(role==='screen'?'/c':'/s'); }
let pc=null, dc=null, path='relay';
function send(m,qos){ const t=JSON.stringify(m);
  if(dc && dc.readyState==='open' && m.t!=='sdp' && m.t!=='ice'){ try{ dc.send(t); if(!qos) return; }catch(e){} }
  relaySend(t,qos); }
function relaySend(t,qos){ for(const c of clients){ try{ if(c.connected) c.publish(outbox(),t,{qos:qos||0}); }catch(e){} } }
function connect(onReady,onErr){
  const go=()=>{ let ready=false, failed=0;
    for(const url of BROKERS){
      let c; try{ c=mqtt.connect(url,{clientId:'pl_'+Math.random().toString(36).slice(2,10),clean:true,reconnectPeriod:3000,connectTimeout:8000}); }catch(e){ failed++; continue; }
      clients.push(c);
      c.on('connect',()=>{ c.subscribe(inbox(),{qos:0}); if(!ready){ ready=true; onReady(); } });
      c.on('message',(tp,p)=>{ try{ const m=JSON.parse(p.toString()); if(m.t==='sdp'||m.t==='ice') rtcSignal(m); else onMsg(m); }catch(e){} });
      c.on('error',()=>{ if(++failed>=BROKERS.length && !ready) onErr(); });
    } };
  if(window.mqtt) go(); else loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js',go,onErr);
}

// ---------- direct link (WebRTC): the relay only carries the handshake ----------
function rtcStart(isScreen){
  if(pc) return;
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.onicecandidate=e=>{ if(e.candidate) send({t:'ice',c:e.candidate.toJSON()},1); };
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==='failed'||pc.connectionState==='closed'){ path='relay'; dc=null; } };
  const wire=ch=>{ dc=ch; ch.onopen=()=>{ path='direct'; checkPath(); }; ch.onclose=()=>{ path='relay'; };
    ch.onmessage=e=>{ try{ onMsg(JSON.parse(e.data)); }catch(x){} }; };
  if(isScreen){
    wire(pc.createDataChannel('ctl',{ordered:false,maxRetransmits:0}));   // late packet = useless, never resend
    pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>send({t:'sdp',d:pc.localDescription.toJSON()},1));
  } else pc.ondatachannel=e=>wire(e.channel);
}
let iceWait=[];
async function rtcSignal(m){
  if(m.t==='sdp'){
    if(m.d.type==='offer'){ if(pc) return; rtcStart(false); }
    if(!pc || pc.remoteDescription) return;
    await pc.setRemoteDescription(m.d);
    for(const c of iceWait){ try{ await pc.addIceCandidate(c); }catch(e){} } iceWait=[];
    if(m.d.type==='offer'){ const a=await pc.createAnswer(); await pc.setLocalDescription(a); send({t:'sdp',d:pc.localDescription.toJSON()},1); }
  } else if(m.t==='ice'){
    if(!pc || !pc.remoteDescription) iceWait.push(m.c); else { try{ await pc.addIceCandidate(m.c); }catch(e){} }
  }
}
let pathKind='';
async function checkPath(){   // host = same local network, srflx/prflx = through the internet, relay = TURN
  try{ const r=await pc.getStats(); let pair=null, loc={};
    r.forEach(v=>{ if(v.type==='candidate-pair' && v.nominated && v.state==='succeeded') pair=v; if(v.type==='local-candidate') loc[v.id]=v; });
    if(pair && loc[pair.localCandidateId]) pathKind=loc[pair.localCandidateId].candidateType;
  }catch(e){}
}



// ================= SCREEN =================
const SENS=[0,46,53,60,68,76];             // max tray tilt (deg) reached at a 60° hand tilt, per sensitivity level
// hand -> tray: a curve, not a straight line: small hand moves stay fine, big ones bite hard
function curve(h,max){ const a=Math.min(1,Math.abs(h)/60); return Math.sign(h)*max*Math.pow(a,1.4); }
const R=1.6, G=981*5/7, GRAV=981;
// test knobs (1–5), clickable on the screen
const RAMP_LOSS=[1,0.6,0.35,0.15,0];      // how much the ramp slope slows the ball (1 = real physics, 0 = not at all)
const RAMP_LIFT=[1,1.25,1.5,1.8,2.1];     // how steeply the lip throws the ball up
const HOP_UP=[150,180,210,240,270];       // hop: upward speed (cm/s)  -> time in the air
const HOP_FWD=[1,1.1,1.2,1.35,1.5];       // hop: forward speed multiplier
const ASSIST_PULL=[0,3,6,9,12,16,60];        // assist: pull toward the path centre (cm/s² per cm off-centre); 6 = test helper
const ASSIST_CALM=[0,0.15,0.3,0.45,0.6,0.8,2.6]; // assist: extra damping of sideways speed
// ball materials: acc = how strongly it answers the tilt, damp = how fast it loses speed (higher = less "runaway", easier to steer back)
const MATS={wood:{name:'Wood',acc:2.0,damp:1.0,c0:'#f0c58e',c1:'#8a5528',dot:'rgba(90,50,20,'},
            iron:{name:'Iron',acc:1.0,damp:0.35,c0:'#d9e0ea',c1:'#3e4654',dot:'rgba(150,40,40,'}};
// ---- tracks are built from straight pieces (any direction) -> real turns, also 90°.
// piece: from A to B, width w0->w1, height h0->h1, t: 'f' floor / 'e' finish
function piece(ax,ay,bx,by,w0,w1,h0,h1,t){ const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len;
  return {ax,ay,bx,by,w0,w1:(w1==null?w0:w1),h0:h0||0,h1:(h1==null?(h0||0):h1),t:t||'f',len,ux,uy,nx:-uy,ny:ux}; }
// old style: straight segments along +y (used by the ramp / hop tracks)
function T(name,kind,segs){ let y=0; const PC=[]; segs.forEach(s=>{ const y0=y; y+=s.l; if(s.t==='g') return;
  PC.push(piece(s.x||0,y0,s.x||0,y,s.w,s.w1,s.h0||0,(s.h1!=null?s.h1:(s.h0||0)),s.t)); });
  const SG=[]; let yy=0; segs.forEach((s,i)=>{ yy+=s.l; if(segs[i+1]&&segs[i+1].t==='g') SG.push({type:kind==='RAMP'?'ramp':'gap',x:(s.x||0)+s.w/2+1.6,y:yy-Math.min(25,s.l*0.6),h:(s.h1!=null?s.h1:(s.h0||0)),ux:0,uy:1}); });
  return finish({name,kind,PC,signs:SG,start:[0,20]}); }
// path style: a list of points {x,y,w,h}; a point with gap:true leaves the stretch before it empty; e:true makes the stretch before it the finish
// join:true on the first / last point = it grows out of (or runs into) another path, so no end wall there
function buildPath(pts,PC,SG,o){ o=o||{}; const N=pts.length;
  const dir=(i)=>{ const a=pts[i], b=pts[i+1], l=Math.hypot(b.x-a.x,b.y-a.y); return [(b.x-a.x)/l,(b.y-a.y)/l]; };
  const has=(i)=>i>=0 && i<N-1 && !pts[i+1].gap;                                 // segment i = point i -> point i+1
  // left/right edge points at every path point: mitred, so neighbouring stretches share their edge exactly
  const side=pts.map((p,i)=>{ const din=has(i-1)?dir(i-1):null, dout=has(i)?dir(i):null, d1=din||dout||[0,1], d2=dout||din||[0,1];
    const n1=[-d1[1],d1[0]], n2=[-d2[1],d2[0]]; let mx=n1[0]+n2[0], my=n1[1]+n2[1]; const ml=Math.hypot(mx,my)||1; mx/=ml; my/=ml;
    const k=(p.w/2)/Math.max(0.35,mx*n1[0]+my*n1[1]); return {L:[p.x-mx*k,p.y-my*k], R:[p.x+mx*k,p.y+my*k]}; });
  let cum=0; const pl={x:pts.map(p=>p.x),y:pts.map(p=>p.y),c:[0]}; for(let i=1;i<N;i++) pl.c.push(pl.c[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  for(let i=1;i<N;i++){ const a=pts[i-1], b=pts[i]; if(b.gap) continue;
    const p=piece(a.x,a.y,b.x,b.y,a.w,b.w,a.h||0,(b.h!=null?b.h:(a.h||0)),b.e?'e':'f');
    p.L0=side[i-1].L; p.R0=side[i-1].R; p.L1=side[i].L; p.R1=side[i].R; p.quad=true; p.cum=cum; cum+=p.len; p.pl=pl; p.s0=pl.c[i-1];
    p.cin=has(i-2)||(i===1&&!!a.join); p.cout=has(i)||(i===N-1&&!!b.join); p.noEdge=Math.min(a.w,b.w)>=30; if(o.fade) p.fade=o.fade; PC.push(p); }
  if(!o.fade && SG) autoSigns(pts,SG,has); }
// warning signs, worked out from the shape of the path: narrowing, up, down, sharp bend, zig-zag, gap
function autoSigns(pts,SG,has){ const N=pts.length, H=p=>p.h||0, C=[0]; for(let i=1;i<N;i++) C.push(C[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const seg=(i)=>{ const a=pts[i], b=pts[i+1], l=Math.hypot(b.x-a.x,b.y-a.y); return {a,b,l,ux:(b.x-a.x)/l,uy:(b.y-a.y)/l}; };
  const turn=(i)=>{ const s1=seg(i-1), s2=seg(i); let d=Math.atan2(s2.uy,s2.ux)-Math.atan2(s1.uy,s1.ux); while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return d; };
  const sharp=(i)=>i>0 && i<N-1 && has(i-1) && has(i) && Math.abs(turn(i))>0.9;
  const last={};                                                         // one sign per obstacle stretch: same kind again only after 150 cm of something else
  const put=(i,s,type,grp,at)=>{ if(last[grp]!=null && at-last[grp]<150){ last[grp]=at; return; } last[grp]=at; if(!has(i)) return;
    const g=seg(i); s=Math.max(2,Math.min(g.l-2,s)); const f=s/g.l, x=g.a.x+g.ux*s, y=g.a.y+g.uy*s, w=g.a.w+(g.b.w-g.a.w)*f, h=H(g.a)+(H(g.b)-H(g.a))*f;
    if(SG.some(o=>Math.hypot(o.x0-x,o.y0-y)<22)) return;
    SG.push({type,x0:x,y0:y,x:x+g.uy*(w/2+1.6),y:y-g.ux*(w/2+1.6),h,ux:g.ux,uy:g.uy}); };
  const before=(i,type,grp)=>{ if(has(i-1) && pts[i-1].w<30) put(i-1,seg(i-1).l-14,type,grp,C[i]); else put(i,3,type,grp,C[i]); };
  for(let i=0;i<N-1;i++){ if(!has(i)) continue; const a=pts[i], b=pts[i+1];
    if(sharp(i)){ let more=false; for(let j=i+1;j<N-1 && C[j]-C[i]<80;j++) if(sharp(j)) more=true;            // several bends close together = winding road
      if(last.bend==null || C[i]-last.bend>=150) put(i-1,seg(i-1).l-18,more?'zigzag':(turn(i)>0?'turnL':'turnR'),'bend',C[i]); else last.bend=C[i]; }
    if(b.w<a.w*0.8 && b.w<=20) before(i,'narrow','narrow');
    const sl=H(b)-H(a); if(sl) before(i,sl>0?'up':'down','slope');
    if(i+2<N && pts[i+2].gap) put(i,seg(i).l-18,'gap','gap',C[i+1]); } }
function PATH(name,kind,pts){ const PC=[], SG=[]; buildPath(pts,PC,SG); return finish({name,kind,PC,signs:SG,start:[pts[0].x,pts[0].y+20]}); }
// a maze: several paths, cordons (bait = never opens, return = opens from the far side, close = shuts silently behind you) and triggers
function MAZE(name,paths,cords,trigs){ const PC=[], SG=[]; paths.forEach(p=>buildPath(p.pts,PC,SG,p)); const p0=paths[0].pts;
  return finish({name,kind:'MAZE',PC,signs:SG,cords,trigs,start:[p0[0].x,p0[0].y+20]}); }
function finish(t){ let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; t.PC.forEach(p=>{ [[p.ax,p.ay],[p.bx,p.by]].forEach(([x,y])=>{ x0=Math.min(x0,x-p.w0);x1=Math.max(x1,x+p.w0);y0=Math.min(y0,y-p.w0);y1=Math.max(y1,y+p.w0); }); });
  t.box=[x0,y0,x1,y1];
  t.SL=[]; t.PC.forEach((p,pi)=>{ const n=Math.max(1,Math.ceil(p.len/5));                       // 5 cm slices, fixed to the world
    for(let k=0;k<n;k++){ const s0=p.len*k/n, s1=p.len*(k+1)/n, w0=p.w0+(p.w1-p.w0)*s0/p.len, w1=p.w0+(p.w1-p.w0)*s1/p.len, h0=p.h0+(p.h1-p.h0)*s0/p.len, h1=p.h0+(p.h1-p.h0)*s1/p.len;
      const c=p.quad?(s,side)=>{ const f=s/p.len, A=side<0?p.L0:p.R0, B=side<0?p.L1:p.R1; return [A[0]+(B[0]-A[0])*f, A[1]+(B[1]-A[1])*f]; }
                    :(s,side,w)=>[p.ax+p.ux*s+p.nx*side*w/2, p.ay+p.uy*s+p.ny*side*w/2];
      t.SL.push({p,pi,k,n,v:[[...c(s0,-1,w0),h0],[...c(s0,1,w0),h0],[...c(s1,1,w1),h1],[...c(s1,-1,w1),h1]],
                 sm:(s0+s1)/2, cxm:p.ax+p.ux*(s0+s1)/2, cym:p.ay+p.uy*(s0+s1)/2, seed:(pi*7919+k*104729)>>>0, slab:Math.floor((s0+(p.cum!=null?p.cum:pi*13))/20), seam:Math.floor((s1+(p.cum!=null?p.cum:pi*13))/20)>Math.floor((s0+(p.cum!=null?p.cum:pi*13))/20)}); } });
  t.SL.forEach(q=>{ q.tint=0.95+0.09*(((q.slab*2654435761)>>>0)%1000)/1000; });
  return t; }
const START=[{x:0,y:0,w:40},{x:0,y:70,w:40}];          // the short wide run-up every test track starts with
function S2(...a){ return START.concat(...a); }
const TRACKS=[
  T('Ramp 1 · small gap','RAMP',[{t:'f',l:70,w:40},{t:'f',l:100,w:22},{t:'f',l:30,w:22,h0:0,h1:4},{t:'g',l:8},{t:'f',l:60,w:30,h0:-8},{t:'e',l:30,w:40,h0:-8}]),
  T('Ramp 2 · wide gap','RAMP',[{t:'f',l:70,w:40},{t:'f',l:150,w:22},{t:'f',l:30,w:22,h0:0,h1:5},{t:'g',l:13},{t:'f',l:60,w:30,h0:-16},{t:'e',l:30,w:40,h0:-16}]),
  T('Ramp 3 · narrow landing','RAMP',[{t:'f',l:70,w:40},{t:'f',l:120,w:22},{t:'f',l:30,w:22,h0:0,h1:4},{t:'g',l:12},{t:'f',l:70,w:11,h0:-10},{t:'e',l:30,w:40,h0:-10}]),
  T('Hop 1 · small gap','HOP',[{t:'f',l:70,w:40},{t:'f',l:60,w:30},{t:'g',l:16},{t:'f',l:60,w:30},{t:'e',l:30,w:40}]),
  T('Hop 2 · gap on a narrow path','HOP',[{t:'f',l:70,w:40},{t:'f',l:70,w:13},{t:'g',l:20},{t:'f',l:70,w:13},{t:'e',l:30,w:40}]),
  T('Hop 3 · double gap','HOP',[{t:'f',l:70,w:40},{t:'f',l:50,w:24},{t:'g',l:15},{t:'f',l:35,w:24},{t:'g',l:18},{t:'f',l:50,w:24},{t:'e',l:30,w:40}]),
  // ---- progressive tracks: easy at the start, hardest at the end
  PATH('Narrowing road','ROAD',S2([{x:0,y:130,w:30},{x:0,y:190,w:22},{x:0,y:250,w:16},{x:0,y:310,w:12},{x:0,y:370,w:9},{x:0,y:430,w:7},{x:0,y:480,w:6},{x:0,y:510,w:40,e:true},{x:0,y:540,w:40,e:true}])),
  PATH('Curves to corners','TURN',S2([{x:0,y:110,w:24},{x:10,y:135,w:24},{x:22,y:160,w:22},{x:27,y:185,w:22},{x:22,y:210,w:20},{x:8,y:232,w:20},{x:0,y:250,w:18},  // soft S-curve
    {x:30,y:290,w:18},{x:-30,y:350,w:16},{x:0,y:390,w:16},                                                   // zig-zag
    {x:0,y:440,w:18},{x:70,y:440,w:18},{x:70,y:500,w:16},{x:0,y:500,w:14},{x:0,y:560,w:12},               // right angles
    {x:-60,y:560,w:11},{x:-60,y:610,w:10},{x:-60,y:640,w:40,e:true},{x:-60,y:670,w:40,e:true}])),

  if(wood){ const g=cx.createRadialGradient(X-rr*.35,Y-rr*.4,rr*.05,X,Y,rr*1.05); g.addColorStop(0,'#f6d3a0'); g.addColorStop(0.55,'#c98a4e'); g.addColorStop(1,'#6e3f1a'); cx.fillStyle=g; cx.fillRect(X-rr,Y-rr,rr*2,rr*2);
    if(rr>4) for(const th of [0.3,0.55,0.8,1.05,1.3,1.57,1.84,2.1,2.36,2.62,2.85]) ring(e3,e1,e2,th,0.04,'rgba(105,58,22,.38)',Math.max(0.8,rr*0.045));
    const k=e1; if(dot(k)>0.1){ const m=pt(k); cx.fillStyle='rgba(80,40,14,'+(0.7*dot(k))+')'; cx.beginPath(); cx.ellipse(m[0],m[1],rr*0.16*dot(k),rr*0.12,0,0,7); cx.fill(); } }   // a knot, shows the spin
  else { const sky=mix(PAL[st.land].sky1[0],PAL[st.land].sky1[1],st.mood), gnd=mix(PAL[st.land].ground[0],PAL[st.land].ground[1],st.mood);
    const g=cx.createLinearGradient(X,Y-rr,X,Y+rr); g.addColorStop(0,rgb(mix(sky,[230,235,242],0.5))); g.addColorStop(0.46,rgb(mix(sky,[250,252,255],0.7))); g.addColorStop(0.5,rgb(mix(gnd,[60,64,72],0.5))); g.addColorStop(1,rgb(mix(gnd,[20,22,26],0.6)));
    cx.fillStyle=g; cx.fillRect(X-rr,Y-rr,rr*2,rr*2);
    if(rr>3){ ring(e1,e2,e3,Math.PI/2,0,'rgba(25,30,40,.7)',Math.max(1,rr*0.07)); ring(e3,e1,e2,Math.PI/2,0,'rgba(25,30,40,.55)',Math.max(1,rr*0.05)); } }
  const sh=cx.createRadialGradient(X-rr*.2,Y-rr*.25,rr*0.5,X,Y,rr*1.02); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,'+(wood?0.45:0.55)+')'); cx.fillStyle=sh; cx.fillRect(X-rr,Y-rr,rr*2,rr*2);
  const hx=X-rr*.38, hy=Y-rr*.42, hl=cx.createRadialGradient(hx,hy,0,hx,hy,rr*(wood?0.5:0.32));
  hl.addColorStop(0,'rgba(255,255,255,'+(wood?0.45:0.95)+')'); hl.addColorStop(wood?0.4:0.25,'rgba(255,255,255,'+(wood?0.15:0.5)+')'); hl.addColorStop(1,'rgba(255,255,255,0)'); cx.fillStyle=hl; cx.fillRect(X-rr,Y-rr,rr*2,rr*2);
  cx.restore();
  cx.strokeStyle='rgba(0,0,0,.35)'; cx.lineWidth=1; cx.beginPath(); cx.arc(X,Y,rr,0,7); cx.stroke();
}
function drawOverlay(){ const b=st.ball;
  cx.textAlign='center';
  if(!st.ready && !b.dead){ const lvl=Math.hypot(st.hx||0,st.hy||0); cx.font='bold 30px system-ui'; cx.fillStyle=lvl<4?'#6ad18a':'#e8ecf5';
    cx.fillText(lvl<4?'hold it…':'Hold the phone level  ('+lvl.toFixed(0)+'°)', W/2, H*0.14); if(lvl<4){ cx.fillStyle='#6ad18a'; cx.fillRect(W/2-100,H*0.14+16,200*Math.min(1,st.levelT),6); } }
  else if(TR.kind==='HOP' && st.ready && !st.done){ cx.font='16px system-ui'; cx.fillStyle='#9cc4ff'; cx.fillText('flick the phone up to hop', W/2, H*0.1); }
  { const lx=W-90, ly=H-90, rad=60, mx=Math.max(-1,Math.min(1,st.tx/SENS[st.sens])), my=Math.max(-1,Math.min(1,st.ty/SENS[st.sens]));
    cx.strokeStyle='rgba(200,210,230,.5)'; cx.lineWidth=2; cx.beginPath(); cx.arc(lx,ly,rad,0,7); cx.stroke(); cx.beginPath(); cx.arc(lx,ly,rad*0.33,0,7); cx.stroke();
    cx.fillStyle='rgba(120,220,150,.9)'; cx.beginPath(); cx.arc(lx-mx*rad*0.85, ly-my*rad*0.85, 9,0,7); cx.fill(); cx.lineWidth=1; }
  cx.textAlign='left';
  const stale=performance.now()-st.lastHeard>1500;
  $('hud').textContent=(stale?'⚠ no data from the phone\n':'')+'build     15\n'+TR.name+'\n'+'land      '+st.land+' · mood '+(st.mood||0).toFixed(2)+'  (L / K)\n'+'done      '+st.wins+'\n'+'falls     '+st.falls+'\n'+
    (TR.kind==='HOP'?'hops      '+st.jumps+'\n':'')+'time      '+st.run.toFixed(1)+' s\n'+'link      '+(path==='direct'?'direct':'relay')+' · '+st.rate.toFixed(0)+'/s';
}

// ================= PHONE =================
let ph={ori:null,seq:0,linked:false,last:0};
function startPhone(pre){ role='phone'; show('join'); if(pre) $('codeIn').value=pre; $('bJoin').onclick=joinPhone; }
async function joinPhone(){
  code=$('codeIn').value.trim().toUpperCase(); if(code.length!==4){ $('jStatus').textContent='4 letters.'; return; }
  try{ if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  addEventListener('deviceorientation',e=>{ if(e.beta==null) return;
    const a=(((screen.orientation&&screen.orientation.angle)||window.orientation||0)+360)%360;
    let b=e.beta, g=e.gamma;                       // sensor angles are in the phone's own frame (portrait)
    if(a===90){ [b,g]=[-e.gamma, e.beta]; }        // landscape, top of the phone to the left
    else if(a===270){ [b,g]=[e.gamma,-e.beta]; }   // landscape, top of the phone to the right
    else if(a===180){ [b,g]=[-e.beta,-e.gamma]; }
    ph.ori={b,g,a}; });
  setInterval(()=>{ if(!ph.linked || !ph.ori) return; const now=performance.now(); if(now-ph.last<16) return;
    ph.last=Math.max(ph.last+16,now-16);                                                         // steady ~60 per second
    send({t:'o',s:ph.seq++,b:+ph.ori.b.toFixed(2),g:+ph.ori.g.toFixed(2),a:ph.ori.a}); },8);
  try{ if(typeof DeviceMotionEvent!=='undefined' && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); }catch(e){}
  // flick: a quick upward jerk of the phone (perpendicular to its screen) = hop
  let lastHop=0, hopId=0;
  addEventListener('devicemotion',e=>{ const ac=e.acceleration; if(!ac || ac.z==null || !ph.linked) return;
    const now=performance.now(); if(ac.z>7 && now-lastHop>600){ lastHop=now; send({t:'jump',id:++hopId},1); if(navigator.vibrate) navigator.vibrate(25); } });
  try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
  $('jStatus').textContent='Connecting…';
  onMsg=m=>{ if(m.t==='ok' && !ph.linked){ ph.linked=true; show('ctrl'); if(navigator.vibrate) navigator.vibrate(60); } };
  connect(()=>{ const hi=()=>{ if(!ph.linked) send({t:'hello'},1); }; hi(); const iv=setInterval(()=>{ ph.linked?clearInterval(iv):hi(); },1200);
                setTimeout(()=>{ if(!ph.linked) $('jStatus').textContent='No screen with this code.'; },12000); },
          ()=>{ $('jStatus').textContent='No connection.'; });
}
$('bZero').onclick=()=>{ send({t:'zero'},1); if(navigator.vibrate) navigator.vibrate(40); };
$('bScreen').onclick=startScreen;
$('bPhone').onclick=()=>startPhone('');
const pre=new URLSearchParams(location.search).get('c'); if(pre) startPhone(pre.toUpperCase());
</script>
